name: Playwright Cucumber Tests

on:
  push:
    branches: [ main, qaCode ]
  pull_request:
    branches: [ main, qaCode ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run tests on'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - qaCode
      node_version:
        description: 'Node.js version to test'
        required: true
        default: '20.x'
        type: choice
        options:
          - 18.x
          - 20.x

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
      fail-fast: false
    
    # Skip matrix if workflow_dispatch with single version selected
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJson('["18.x", "20.x"]'), matrix.node-version) }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build TypeScript
        run: npm run build

      - name: Run Cucumber tests
        run: npm test
        env:
          CI: 'true'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-${{ matrix.node-version }}
          path: reports/
          if-no-files-found: warn
